name: Navy Federal Credit Union
kind: company
description: >-
  Navy Federal Credit Union is a federally chartered credit union headquartered
  in Vienna, Virginia, and the largest credit union in the world by both assets
  and membership, serving more than 14 million members across the armed forces,
  Department of Defense, veterans, and their families. As a not-for-profit,
  member-owned financial cooperative regulated by the National Credit Union
  Administration (NCUA), it offers deposit accounts, credit cards, auto and
  mortgage lending, and investment services. On the open-finance front, Navy
  Federal operates a genuine first-party developer program — the Navy Federal
  API Exchange at developer.navyfederal.org — that publishes a consumer-
  permissioned, open-banking-style API catalog of eight data-access products
  (account details, holders, statements, transactions, customer accounts,
  customer details, plus OAuth/API-management and an mTLS gateway-connectivity
  test). Access is partner-gated behind registration and a signed Data Access
  Agreement, secured with OAuth member consent and mutual-TLS whitelisting;
  no OpenAPI/Swagger is publicly downloadable pre-login. Navy Federal also
  exposes member-permissioned data through aggregators (Plaid, Envestnet |
  Yodlee via a 2021 data access agreement, Flinks) rather than solely direct
  first-party integration.
