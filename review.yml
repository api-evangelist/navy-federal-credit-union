  - url: https://www.prnewswire.com/news-releases/envestnet--yodlee-partners-with-navy-federal-credit-union-on-data-access-agreement-for-improved-consumer-access-to-financial-data-301387690.html
    type: Reference
    note: 2021 Envestnet | Yodlee Data Access Agreement enabling token-based member data sharing to 1,400+ apps.
